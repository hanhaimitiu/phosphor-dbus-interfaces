<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 960" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <style>
    .panel{fill:#ffffff;stroke:#d8d2c7;stroke-width:1.5;}
    .phead{fill:#ece7df;stroke:#d8d2c7;stroke-width:1.5;}
    .ptitle{fill:#2d2a27;font-size:15px;font-weight:700;}
    .box{fill:#ffffff;stroke:#3f6b78;stroke-width:1.5;rx:6;}
    .bbox{fill:#e3ecee;stroke:#3f6b78;stroke-width:1.5;rx:6;}
    .bmain{fill:#2d2a27;font-size:13px;font-weight:600;}
    .bsub{fill:#5c5650;font-size:11px;}
    .arrow{stroke:#3f6b78;stroke-width:1.8;fill:none;}
    .anum{fill:#3f6b78;font-size:12px;font-weight:700;}
    .acc{fill:#3f6b78;font-size:12.5px;font-weight:700;}
    .note{fill:#a86a4c;font-size:11.5px;}
    .nest{fill:#f4f1ea;stroke:#c9c2b6;stroke-width:1.2;rx:6;}
    .nl{fill:#5c5650;font-size:11px;}
    .nlh{fill:#2d2a27;font-size:11.5px;font-weight:700;}
    .ttl{fill:#2d2a27;font-size:17px;font-weight:700;}
    .role{fill:#5c5650;font-size:12px;}
  </style>

  <text x="380" y="30" text-anchor="middle" class="ttl">phosphor-dbus-interfaces</text>
  <text x="380" y="50" text-anchor="middle" class="role">全 BMC 共用的 D-Bus 接口字典 · YAML 定义→C++ 头文件</text>

  <!-- Panel A 业务流程：一份 YAML 如何变成 C++ 类 -->
  <rect class="panel" x="20" y="64" width="720" height="414" rx="6"/>
  <rect class="phead" x="20" y="64" width="720" height="32" rx="6"/>
  <text x="34" y="86" class="ptitle">一、业务流程：一份 YAML 如何变成 C++ 类</text>

  <rect class="box" x="90" y="102" width="580" height="46" rx="6"/>
  <text x="110" y="120" class="bmain">① 输入：yaml/ 下 *.interface.yaml（Sensor.Value：properties Value / Unit）</text>
  <text x="110" y="138" class="bsub">yaml/xyz/openbmc_project/Sensor/Value.interface.yaml:29-59</text>

  <line class="arrow" x1="380" y1="148" x2="380" y2="160"/>
  <polygon points="372,158 388,158 380,172" fill="#3f6b78"/>

  <rect class="box" x="90" y="172" width="580" height="46" rx="6"/>
  <text x="110" y="190" class="bmain">② 生成工具：sdbus++（来自 sdbusplus 的 tools/，本仓库经 wrap 引入）</text>
  <text x="110" y="208" class="bsub">meson.build:16-17 ｜ subprojects/sdbusplus.wrap:2-6</text>

  <line class="arrow" x1="380" y1="218" x2="380" y2="230"/>
  <polygon points="372,228 388,228 380,242" fill="#3f6b78"/>

  <rect class="box" x="90" y="242" width="580" height="46" rx="6"/>
  <text x="110" y="260" class="bmain">③ meson custom_target 调 sdbus++ --command cpp 读取 YAML</text>
  <text x="110" y="278" class="bsub">gen/xyz/openbmc_project/Sensor/Value/meson.build:5-28</text>

  <line class="arrow" x1="380" y1="288" x2="380" y2="300"/>
  <polygon points="372,298 388,298 380,312" fill="#3f6b78"/>

  <rect class="box" x="90" y="312" width="580" height="46" rx="6"/>
  <text x="110" y="330" class="bmain">④ 产出：common.hpp / server.hpp / client.hpp（+ errors → error.hpp/.cpp）</text>
  <text x="110" y="348" class="bsub">gen/xyz/openbmc_project/State/Host/meson.build:11-19</text>

  <line class="arrow" x1="380" y1="358" x2="380" y2="370"/>
  <polygon points="372,368 388,368 380,382" fill="#3f6b78"/>

  <rect class="bbox" x="90" y="382" width="580" height="46" rx="6"/>
  <text x="110" y="400" class="bmain">⑤ 各服务 #include：实现方继承 server.hpp，调用方用 client.hpp</text>
  <text x="110" y="418" class="bsub">gen/xyz/openbmc_project/State/Host/meson.build:15-18</text>

  <text x="40" y="446" class="nl">注：本仓库不跑进程、不占 D-Bus service name，只产出 libphosphor_dbus 共享库与头文件（meson.build:77-85）</text>
  <text x="40" y="462" class="nl">价值：同一份 YAML 让各进程对「开机」的属性名、枚举值、错误名完全一致（README.md:3-4）</text>

  <!-- Panel B 代码体系结构 -->
  <rect class="panel" x="20" y="490" width="720" height="210" rx="6"/>
  <rect class="phead" x="20" y="490" width="720" height="32" rx="6"/>
  <text x="34" y="512" class="ptitle">二、代码体系结构：定义字典如何组织</text>

  <rect class="nest" x="36" y="530" width="344" height="80" rx="6"/>
  <text x="50" y="546" class="nlh">yaml/ 反域名分层</text>
  <text x="50" y="564" class="nl">com/ · org/ · xyz/，默认只构建</text>
  <text x="50" y="582" class="nl">xyz/openbmc_project 与 org/freedesktop</text>
  <text x="50" y="600" class="nl">meson.build:45-53 ｜ README.md:21-22</text>

  <rect class="nest" x="36" y="618" width="344" height="72" rx="6"/>
  <text x="50" y="634" class="nlh">4 种 yaml 后缀（同 basename 配对）</text>
  <text x="50" y="652" class="nl">*.interface.yaml 347 · *.errors.yaml 39</text>
  <text x="50" y="670" class="nl">*.events.yaml 24 · *.metadata.yaml 27</text>

  <rect class="nest" x="392" y="530" width="340" height="80" rx="6"/>
  <text x="406" y="546" class="nlh">gen/ 自动生成的 meson（勿手改）</text>
  <text x="406" y="564" class="nl">sdbus++-gen-meson 产出，gen/README:1-2</text>
  <text x="406" y="582" class="nl">命令见 gen/regenerate-meson:22-26</text>
  <text x="406" y="600" class="nl">工具来自 subprojects/sdbusplus.wrap:2-6</text>

  <rect class="nest" x="392" y="618" width="340" height="72" rx="6"/>
  <text x="406" y="634" class="nlh">接口定义要素（顶层 key）</text>
  <text x="406" y="652" class="nl">properties / methods / signals / enumerations</text>
  <text x="406" y="670" class="nl">associations / paths / service_names</text>

  <!-- Panel C 对外交互 -->
  <rect class="panel" x="20" y="712" width="720" height="234" rx="6"/>
  <rect class="phead" x="20" y="712" width="720" height="32" rx="6"/>
  <text x="34" y="734" class="ptitle">三、对外 D-Bus 交互</text>

  <text x="40" y="762" class="acc">入站（谁消费本仓库的定义）：</text>
  <text x="40" y="780" class="nl">· 服务实现方 #include server.hpp / aserver.hpp，继承骨架实现接口</text>
  <text x="40" y="796" class="nl">  出处 gen/xyz/openbmc_project/State/Host/meson.build:15-17</text>
  <text x="40" y="814" class="nl">· 调用方（如 bmcweb）#include client.hpp 读写属性 / 调方法</text>
  <text x="40" y="830" class="nl">  出处 gen/xyz/openbmc_project/State/Host/meson.build:18</text>

  <text x="40" y="854" class="acc">出站（本仓库产出）：</text>
  <text x="40" y="872" class="nl">· events.yaml → --command registry → *.json → datadir/redfish-registry/</text>
  <text x="40" y="888" class="nl">  出处 gen/meson.build:17 ｜ gen/xyz/openbmc_project/State/meson.build:64-65</text>
  <text x="40" y="906" class="nl">· 供 Redfish / bmcweb 引用消息定义（属性↔Redfish 映射归消费方维护）</text>

  <text x="40" y="930" class="acc">一句话：本仓库定规矩 → sdbusplus 变 C++ 类型 → 实现方干活 → 调用方来取（业务详解:430）</text>
</svg>
